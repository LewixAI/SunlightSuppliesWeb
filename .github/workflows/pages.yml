# Build the static export and publish it to GitHub Pages.
#
# The site is a project page, so it is served from /SunlightSuppliesWeb/ and the
# build needs BASE_PATH to match. If a custom domain is added later, drop the
# BASE_PATH line — a domain apex serves from the root.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The rack inspector is a development instrument — four orthographic
      # views and a millimetre extents table. It is unlinked but it would be a
      # real, publicly reachable route, so it never goes into the shipped tree.
      - name: Drop the debug route
        run: rm -rf app/debug

      - run: npm run build
        env:
          BASE_PATH: /SunlightSuppliesWeb

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
